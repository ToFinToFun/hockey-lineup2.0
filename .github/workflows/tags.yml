name: Versionstaggar

# Sätter taggen vX.Y.Z på varje versionscommit ("vX.Y.Z: …") som saknar tagg,
# så att man alltid ser vilken version som är ute. Körs vid push till main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Skapa saknade taggar
        run: |
          git fetch --tags --force
          git log --format='%H %s' -300 | while read -r sha subject; do
            ver=$(printf '%s' "$subject" | sed -nE 's/^(v[0-9]+\.[0-9]+\.[0-9]+):.*/\1/p')
            [ -z "$ver" ] && continue
            if ! git rev-parse -q --verify "refs/tags/$ver" >/dev/null; then
              echo "Taggar $ver → $sha"
              git tag "$ver" "$sha"
              # GitHub nekar taggar på commits med andra workflow-filer än nu (token utan
              # workflows-rättighet) – de hoppas över i stället för att stoppa resten
              git push origin "refs/tags/$ver" || echo "::warning::$ver kunde inte pushas (äldre workflow-filer) – skapa den i GitHub vid behov"
            fi
          done
